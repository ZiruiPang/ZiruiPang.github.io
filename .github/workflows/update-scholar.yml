name: Update Google Scholar metrics

on:
  schedule:
    # Daily 01:00 UTC (09:00 Asia/Shanghai)
    - cron: "0 1 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update-scholar.yml"
      - "scripts/update_scholar.py"

permissions:
  contents: write

jobs:
  update-scholar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Google Scholar metrics
        run: python scripts/update_scholar.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- _data/scholar.json; then
            echo "No changes to _data/scholar.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/scholar.json
          git commit -m "chore: update Google Scholar metrics"
          git push
